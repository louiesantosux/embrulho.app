<style>
/* Layout: barra superior de vidro flutuante + trilho de ícones em vidro + painel lateral + área principal; superfícies Liquid Glass sobre fundo ambiente. */
:root{
  --canvas:#e7ebe5; --frame:rgba(255,255,255,.46); --panel:rgba(255,255,255,.42); --surface:rgba(255,255,255,.5); --raised:rgba(255,255,255,.72);
  --ink:#1f2630; --ink-2:#4e5960; --ink-3:#7f8a85; --line:rgba(31,38,48,.08); --line-2:rgba(31,38,48,.16);
  --rail:#1f2630; --rail-ink:#eef1ec; --rail-dim:#8c9894;
  --lime:#1e5a45; --lime-ink:#ffffff; --lime-soft:rgba(156,201,181,.4); --glow:#9cc9b5;
  --heart:#1e5a45; --heart-off:rgba(31,38,48,.14);
  --ok:#1e5a45; --warn:#9a6a12;
  --glass-border:rgba(255,255,255,.78); --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(255,255,255,.25); --glass-shadow:rgba(31,60,48,.22);
  --sheen:rgba(255,255,255,.55); --tint:rgba(31,38,48,.86);
  --blob-a:rgba(156,201,181,.85); --blob-b:rgba(30,90,69,.35); --blob-c:rgba(244,242,236,.95); --blob-d:rgba(190,220,205,.8);
  --shadow:inset 0 1px 0 var(--glass-hi), 0 10px 30px -18px var(--glass-shadow);
  --m-card:rgba(255,255,255,.78); --m-chip:rgba(255,255,255,.62); --m-sheet:#f4f6f2;
  --f-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:34px; --r-md:26px; --r-sm:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --canvas:#2b302a; --frame:rgba(44,48,43,.52); --panel:rgba(255,255,255,.06); --surface:rgba(255,255,255,.07); --raised:rgba(38,41,37,.62);
  --ink:#e9ece4; --ink-2:#b3bbae; --ink-3:#858d81; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --rail:#121411; --rail-ink:#e3e8dd; --rail-dim:#899185;
  --lime:#a9c9a3; --lime-ink:#1c1f1b; --lime-soft:rgba(169,201,163,.2); --glow:#a9c9a3;
  --heart:#a9c9a3; --heart-off:rgba(255,255,255,.16); --ok:#a9c9a3; --warn:#e0b25a;
  --glass-border:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.2); --glass-lo:rgba(255,255,255,.04); --glass-shadow:rgba(0,0,0,.55);
  --sheen:rgba(255,255,255,.07); --tint:rgba(16,18,15,.72);
  --blob-a:rgba(169,201,163,.32); --blob-b:rgba(93,122,90,.55); --blob-c:rgba(62,68,61,.9); --blob-d:rgba(120,150,110,.35);
  --shadow:inset 0 1px 0 var(--glass-hi), 0 14px 30px -20px var(--glass-shadow);
  --m-card:rgba(46,51,45,.9); --m-chip:rgba(255,255,255,.08); --m-sheet:#262a25;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --canvas:#2b302a; --frame:rgba(44,48,43,.52); --panel:rgba(255,255,255,.06); --surface:rgba(255,255,255,.07); --raised:rgba(38,41,37,.62);
  --ink:#e9ece4; --ink-2:#b3bbae; --ink-3:#858d81; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --rail:#121411; --rail-ink:#e3e8dd; --rail-dim:#899185;
  --lime:#a9c9a3; --lime-ink:#1c1f1b; --lime-soft:rgba(169,201,163,.2); --glow:#a9c9a3;
  --heart:#a9c9a3; --heart-off:rgba(255,255,255,.16); --ok:#a9c9a3; --warn:#e0b25a;
  --glass-border:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.2); --glass-lo:rgba(255,255,255,.04); --glass-shadow:rgba(0,0,0,.55);
  --sheen:rgba(255,255,255,.07); --tint:rgba(16,18,15,.72);
  --blob-a:rgba(169,201,163,.32); --blob-b:rgba(93,122,90,.55); --blob-c:rgba(62,68,61,.9); --blob-d:rgba(120,150,110,.35);
  --shadow:inset 0 1px 0 var(--glass-hi), 0 14px 30px -20px var(--glass-shadow);
  --m-card:rgba(46,51,45,.9); --m-chip:rgba(255,255,255,.08); --m-sheet:#262a25;
  color-scheme:dark }

*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:76px 268px minmax(0,1fr);gap:14px;max-width:1440px;margin:0 auto;min-height:calc(100vh - 110px)}
.rail-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;height:calc(100vh - 110px)}
.rail-col{display:flex;flex-direction:column;gap:12px}
.rail{background:var(--rail);border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;box-shadow:0 18px 30px -20px rgba(0,0,0,.6)}
.rail .brand{width:44px;height:44px;display:grid;place-items:center;color:var(--rail-ink);border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px;padding-bottom:10px}
.rail-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--rail-dim);transition:background .2s,color .2s;position:relative}
.rail-btn:hover{color:var(--rail-ink);background:rgba(255,255,255,.06)}
.rail-btn[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--rail-ink)}
.rail-btn.add{background:var(--glow);color:var(--rail)}
.rail-btn.add:hover{background:var(--glow);filter:brightness(1.06)}
.rail-spacer{flex:1}
.rail-tag{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--rail-dim);opacity:.6;padding-block:6px}
.rail-foot{background:var(--frame);border-radius:22px;padding:10px;display:flex;justify-content:center}
.rail-foot .rail-btn{background:var(--rail);color:var(--rail-ink)}

.side{background:var(--frame);border-radius:var(--r-lg);padding:20px 16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line-2)}
.dots i:nth-child(1){background:var(--lime)}.dots i:nth-child(2){background:var(--glow)}.dots i:nth-child(3){background:var(--line-2)}
.me{display:flex;align-items:center;gap:12px;padding:4px 4px}
.me b{display:block;font-weight:500;font-size:16px;line-height:1.2}
.me span{font-size:13px;color:var(--ink-3)}
.side h4{margin:0 0 6px 8px;font-weight:400;font-size:13px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;text-align:left;width:100%;color:var(--ink);font-size:15px}
.nav button:hover{background:var(--panel)}
.nav button[aria-pressed="true"]{background:var(--raised);box-shadow:var(--shadow)}
.nav button .ic{color:var(--ink-2)}
.nav button .ct{margin-left:auto;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;background:var(--panel);color:var(--ink-3);padding:0 6px}
.nav button[aria-pressed="true"] .ct{background:var(--frame)}
.side hr{border:0;border-top:1px solid var(--line);margin:0}
.side .grow{flex:1}

.main{background:var(--frame);border-radius:var(--r-lg);padding:28px 30px 34px;min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:clamp(30px,4vw,44px);line-height:1.05}
.head p{margin:6px 0 0;color:var(--ink-3);font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--lime);color:var(--lime-ink);box-shadow:0 8px 20px -12px rgba(30,90,69,.6)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--rail);color:var(--rail-ink)}
.btn.ghost{background:var(--raised);box-shadow:var(--shadow)}
.btn.line{border:1px dashed var(--line-2);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;padding:4px 0}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:16px 20px 18px;border:1px solid var(--line);min-width:0}
.stat .lab{font-size:14px;color:var(--ink-2)}
.stat .big{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,5vw,64px);line-height:1;margin-top:10px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stat .big small{font-size:15px;font-family:var(--f-body);font-weight:500;letter-spacing:0;background:var(--lime-soft);color:var(--ink);padding:3px 10px;border-radius:999px}
.stat .mid{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.1;margin-top:12px}
.stat .sub{font-size:13px;color:var(--ink-3);margin-top:6px}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:10px}
.pillrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pillrow::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--panel);color:var(--ink-2);font-size:14px;transition:background .15s}
.pill:hover{background:var(--surface)}
.pill[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.pill .ic{width:18px;height:18px}
.subrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.select{height:40px;border-radius:999px;background:var(--panel);border:0;padding:0 34px 0 14px;font-size:13px;color:var(--ink-2);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--raised);border-radius:var(--r-md);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);position:relative;min-width:0;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 18px 32px -24px rgba(0,0,0,.45)}
.card.got{opacity:.62}
.card-top{display:flex;align-items:center;gap:10px}
.cat-ic{width:38px;height:38px;border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--ink-2);flex:none}
.card-top .meta{min-width:0;flex:1}
.card-top .meta .mono{display:block}
.card-top .meta .price{font-size:13px;color:var(--ink-2)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--panel);flex:none}
.icon-btn:hover{color:var(--ink)}
.card h3{font-size:20px;line-height:1.2;font-weight:400;overflow-wrap:anywhere}
.card .note{font-size:13px;color:var(--ink-2);margin:-4px 0 0;overflow-wrap:anywhere}
.hearts{display:flex;align-items:center;gap:2px}
.hearts button{padding:3px;border-radius:8px;color:var(--heart-off);transition:transform .12s,color .12s}
.hearts button.on{color:var(--heart)}
.hearts button:not([disabled]):hover{transform:scale(1.15)}
.hearts button[disabled]{cursor:default}
.hearts .lvl{margin-left:8px;font-size:12px;color:var(--ink-3)}
.occ{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--panel);font-size:12px;color:var(--ink-2)}
.chip.next{background:var(--lime);color:var(--lime-ink);font-weight:500}
.chip.sug{background:transparent;border:1px dashed var(--line-2)}
.chip.got{background:var(--rail);color:var(--rail-ink)}
.card-foot{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line-2);padding-top:10px;font-size:13px;color:var(--ink-3)}
.card-foot a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.card-foot a:hover{text-decoration:underline}
.card-foot .r{margin-left:auto}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu button{height:32px;padding:0 12px;border-radius:999px;background:var(--panel);font-size:12.5px}
.menu button.danger{color:var(--heart)}
.menu button.danger.confirm{background:var(--heart);color:#fff}

.empty{border:1px dashed var(--line-2);border-radius:var(--r-md);padding:36px 24px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-size:22px;color:var(--ink)}
.empty p{margin:0;max-width:44ch}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.banner b{color:var(--ink);font-weight:500}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);margin-top:6px;flex:none;box-shadow:0 0 0 4px var(--lime-soft)}

/* ---------- avatars ---------- */
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px;color:#1e201f;overflow:hidden;border:2px solid var(--raised);box-shadow:0 0 0 1px var(--line-2)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:12px;border-width:1.5px}
.av.lg{width:64px;height:64px;font-size:22px}

/* ---------- friends ---------- */
.friend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fcard{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0}
.fcard:hover{box-shadow:0 18px 32px -24px rgba(0,0,0,.45)}
.fcard .row{display:flex;align-items:center;gap:12px}
.fcard b{font-weight:500;font-size:16px;display:block;line-height:1.2;overflow-wrap:anywhere}
.fcard .sub{font-size:13px;color:var(--ink-3)}
.fcard .top{background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.fcard .top strong{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:22px}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:14px;background:var(--raised);border:1px dashed var(--line-2);padding:0 14px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:15px}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px}
.person:hover{background:var(--panel)}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-weight:500;overflow-wrap:anywhere}
.person .who span{font-size:12.5px;color:var(--ink-3)}
.person .btn{height:36px;padding:0 14px;font-size:13px}
.hint{font-size:13px;color:var(--ink-3);margin:0}

/* ---------- profile ---------- */
.form{display:flex;flex-direction:column;gap:16px;max-width:560px}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.field .opt{font-weight:400;color:var(--ink-3)}
.input,.textarea{width:100%;height:46px;border-radius:14px;border:1px solid var(--line-2);background:var(--raised);padding:0 14px;font-size:15px;outline:0}
.textarea{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
.input:focus,.textarea:focus{border-color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pick{height:36px;padding:0 13px;border-radius:999px;background:var(--panel);font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.pick[aria-pressed="true"]{background:var(--rail);color:var(--rail-ink)}
.pick.sug:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1.5px var(--lime);background:var(--lime-soft);color:var(--ink)}
.pick .ic{width:16px;height:16px}
.err{color:var(--heart);font-size:13px;margin:0}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,16,15,.42);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--frame);border-radius:var(--r-lg);width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);margin-block:auto}
.dialog .dhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dialog h2{font-size:28px}
.dialog .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}

/* ---------- login ---------- */
.login{max-width:1100px;margin:0 auto;min-height:calc(100vh - 110px);display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.login .art{background:var(--rail);color:var(--rail-ink);border-radius:var(--r-lg);padding:32px;display:flex;flex-direction:column;gap:24px;position:relative;overflow:hidden;min-width:0}
.login .art h1{font-size:clamp(44px,6vw,78px);line-height:.95;font-weight:300;letter-spacing:-.035em}
.login .art h1 em{font-style:normal;color:var(--glow)}
.login .art p{color:var(--rail-dim);max-width:40ch;margin:0;font-size:16px}
.demo-cards{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.demo-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;max-width:380px}
.demo-card:nth-child(2){margin-left:36px}.demo-card:nth-child(3){margin-left:12px}
.demo-card b{font-weight:500;font-size:14px;display:block}
.demo-card span{font-size:12px;color:var(--rail-dim)}
.demo-card .hearts button{color:rgba(255,255,255,.18)}
.demo-card .hearts button.on{color:var(--glow)}
.login .box{background:var(--frame);border-radius:var(--r-lg);padding:32px;display:flex;flex-direction:column;justify-content:center;gap:22px;min-width:0}
.login .box h2{font-size:32px}
.login .acct{display:flex;align-items:center;gap:14px;background:var(--raised);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow)}
.login .acct b{display:block;font-weight:500;font-size:17px;overflow-wrap:anywhere}
.login .acct span{font-size:13px;color:var(--ink-3)}
.login .btn{height:52px;justify-content:center;font-size:15px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rail);color:var(--rail-ink);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 18px 30px -16px rgba(0,0,0,.6);max-width:calc(100vw - 32px)}


/* ---------- liquid glass ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas)}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--canvas)}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px)}
.ambient i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:var(--blob-a)}
.ambient i:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;top:18vh;background:var(--blob-b)}
.ambient i:nth-child(3){width:46vmax;height:46vmax;left:22vw;bottom:-24vmax;background:var(--blob-d)}
.ambient i:nth-child(4){width:30vmax;height:30vmax;left:40vw;top:-8vmax;background:var(--blob-c)}
#app{position:relative;z-index:1}
.side,.main,.rail,.rail-foot,.stat,.card,.fcard,.panel,.dialog,.login .box,.topbar-inner,.search,.empty,.banner,.seg,.pill,.select,.menu button,.icon-btn,.cat-ic,.btn.ghost,.pick,.input,.textarea,.chip:not(.next):not(.got),.nav button[aria-pressed="true"],.toast{
  -webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);
  transition:background-color .35s,border-color .35s,box-shadow .35s,color .35s}
.side,.main,.rail,.rail-foot,.stat,.card,.fcard,.panel,.dialog,.login .box,.topbar-inner{
  background:linear-gradient(180deg,var(--sheen),transparent 38%),var(--frame);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo),0 24px 60px -30px var(--glass-shadow)}
.stat,.card,.fcard,.panel{background:linear-gradient(180deg,var(--sheen),transparent 45%),var(--surface)}
.card:hover,.fcard:hover{box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo),0 26px 50px -26px var(--glass-shadow);transform:translateY(-2px)}
.pill,.seg,.select,.icon-btn,.cat-ic,.menu button,.pick,.chip:not(.next):not(.got),.search,.input,.textarea{border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi)}
.pill[aria-pressed="true"],.seg button[aria-pressed="true"],.nav button[aria-pressed="true"]{background:var(--raised);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 18px -10px var(--glass-shadow)}
.btn.ghost{border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 20px -14px var(--glass-shadow)}
.btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 10px 24px -12px var(--glass-shadow)}
.empty,.banner{background:var(--panel);border:1px solid var(--glass-border)}
.dialog{background:linear-gradient(180deg,var(--sheen),transparent 30%),var(--raised)}
.overlay{background:rgba(15,20,17,.28)}
.toast{background:var(--tint)}

/* rail becomes a glass tab bar */
.rail .brand{display:none}
.rail-btn{color:var(--ink-3)}
.rail-btn:hover{color:var(--ink);background:var(--panel)}
.rail-btn[aria-current="page"]{color:var(--ink);background:var(--raised);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 16px -8px var(--glass-shadow)}
.rail-btn.add{background:var(--lime);color:var(--lime-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -10px var(--glass-shadow)}
.rail-btn.add:hover{background:var(--lime)}
.rail-tag{color:var(--ink-3)}
.rail-foot .rail-btn{background:var(--panel);color:var(--ink-2);border:1px solid var(--glass-border)}

/* login hero as tinted glass */
.login .art{background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%),var(--tint);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 60px -30px var(--glass-shadow)}
.demo-card{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;max-width:1440px;margin:0 auto 14px;padding-top:2px}
.topbar-inner{display:flex;align-items:center;gap:14px;height:64px;padding:0 10px 0 12px;border-radius:999px}
.tb-brand{padding:4px 12px 4px 0;border-radius:999px;color:inherit;transition:opacity .2s}
.tb-brand:hover{opacity:.8}
.tb-brand:active .mark{transform:scale(.94)}
.tb-brand .mark{transition:transform .15s}
.tb-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.tb-brand .mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tb-nav{display:flex;gap:4px;margin-left:12px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi)}
.tb-nav button{height:38px;padding:0 16px;border-radius:999px;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:background .25s,color .25s}
.tb-nav button:hover{color:var(--ink)}
.tb-nav button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 16px -8px var(--glass-shadow)}
.tb-spacer{flex:1}
.tb-av{display:flex;border-radius:50%;padding:2px;transition:transform .55s var(--spring,ease),box-shadow .3s}
.tb-av:hover{box-shadow:0 0 0 2px var(--glow)}
.tb-av:active{transform:scale(.9);transition-duration:.14s}
.tb-av[aria-current="page"]{box-shadow:0 0 0 2px var(--lime)}
.me{width:100%;padding:8px;border-radius:18px;color:inherit;transition:background-color .25s,transform .55s var(--spring,ease)}
.me:hover{background:var(--panel)}
.me:active{transform:scale(.97);transition-duration:.14s}
.me[aria-current="page"]{background:var(--raised);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 18px -10px var(--glass-shadow)}

/* day / night switch */
.mode{position:relative;display:flex;align-items:center;height:34px;width:118px;border-radius:999px;padding:0;flex:none;
  background:#e4e5e6;color:#1a1a1a;border:1.5px solid #e4e5e6;box-shadow:inset 0 1px 2px rgba(0,0,0,.07);transition:background .45s,color .45s,border-color .45s}
.mode .lbl{font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;position:absolute;top:50%;left:12px;transform:translateY(-50%);transition:left .45s cubic-bezier(.5,1.4,.5,1)}
.mode .knob{position:absolute;top:1.5px;left:calc(100% - 30.5px);width:28px;height:28px;border-radius:50%;background:#fff;color:#9a9da1;display:grid;place-items:center;
  box-shadow:-1.5px 0 0 #c4c6c9,0 3px 8px -4px rgba(0,0,0,.3);transition:left .45s cubic-bezier(.5,1.4,.5,1),box-shadow .45s,color .45s}
.mode .knob svg{position:absolute;transition:opacity .3s,transform .45s}
.mode .moon{opacity:0;transform:rotate(-60deg) scale(.6)}
.mode[aria-checked="true"]{background:#0b0b0b;color:#f2f2f2;border-color:#f2f2f2;box-shadow:0 0 0 1.5px #0b0b0b}
.mode[aria-checked="true"] .lbl{left:38px}
.mode[aria-checked="true"] .knob{left:1.5px;color:#7d8085;box-shadow:0 0 0 1.5px #0b0b0b,0 3px 8px -4px rgba(0,0,0,.5)}
.mode[aria-checked="true"] .sun{opacity:0;transform:rotate(90deg) scale(.6)}
.mode[aria-checked="true"] .moon{opacity:1;transform:none}
.mode:focus-visible{outline:2px solid var(--lime);outline-offset:3px}


/* ---------- add-wish sheet ---------- */
.tb-add{height:40px;padding:0 16px 0 12px;font-size:13.5px}
.dialog.sheet{max-width:1040px;padding:0;gap:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"form side" "act act";overflow:clip}
.sheet-form{grid-area:form;padding:26px 28px 8px;display:flex;flex-direction:column;gap:26px;min-width:0}
.sheet-form .dhead{align-items:flex-start}
.sheet-form h2{font-size:clamp(26px,3vw,34px);margin-top:4px}
.sheet-side{grid-area:side;padding:26px 24px;border-left:1px solid var(--line);background:var(--panel);min-width:0}
.sheet-side .stick{position:sticky;top:24px;display:flex;flex-direction:column;gap:12px}
.sheet-actions{grid-area:act;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  position:sticky;bottom:0;z-index:2;background:linear-gradient(180deg,var(--sheen),transparent),var(--raised);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%)}
.sheet-actions .grow{flex:1}
.fs{display:flex;flex-direction:column;gap:14px}
.fs + .fs{border-top:1px dashed var(--line-2);padding-top:22px}
.fs-h{display:flex;align-items:center;gap:10px;font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:0}
.fs-h span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--lime-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.fs-h .opt{width:auto;height:auto;background:none;font-weight:400;color:var(--ink-3);font-size:13px}
.affix{position:relative;display:flex;align-items:center}
.affix > .ic,.affix > .pre{position:absolute;left:14px;color:var(--ink-3);pointer-events:none;font-size:14px}
.affix .input{padding-left:42px}
.affix .host{position:absolute;right:8px;height:30px;padding:0 10px;border-radius:999px;background:var(--lime-soft);font-size:12px;display:inline-flex;align-items:center;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;background:var(--lime-soft);color:var(--ink);border:1px solid var(--glass-border);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{font-size:13px;text-decoration:underline;color:var(--ink);white-space:nowrap}
.input.bad{border-color:var(--warn)}
.badrow .pick{box-shadow:inset 0 0 0 1px var(--warn)}
.err{color:var(--warn)}
.pick .dd{opacity:.55;font-size:11.5px}
.bighearts{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bighearts button{padding:4px;border-radius:12px;color:var(--heart-off);transition:transform .18s cubic-bezier(.5,1.8,.5,1),color .15s}
.bighearts button.on{color:var(--heart)}
.bighearts button:hover{transform:scale(1.14)}
.bighearts button[aria-checked="true"]{transform:scale(1.08)}
.bh-label{margin-left:14px;display:flex;flex-direction:column;line-height:1.2}
.bh-label b{font-family:var(--f-display);font-weight:500;font-size:20px}
.bh-label span{font-size:12px;color:var(--ink-3)}
.stepper{display:inline-flex;align-items:center;height:46px;border-radius:14px;border:1px solid var(--glass-border);background:var(--raised);box-shadow:inset 0 1px 0 var(--glass-hi);width:fit-content}
.stepper button{width:46px;height:44px;font-size:20px;color:var(--ink-2)}
.stepper button[disabled]{opacity:.3;cursor:default}
.stepper output{min-width:32px;text-align:center;font-weight:500}
.card .det{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.card .det span{font-size:12px;color:var(--ink-2);padding:2px 9px;border-radius:999px;border:1px solid var(--line-2)}
.card.preview{pointer-events:none}
.card.preview:hover{transform:none}
.ps{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:12px 14px}
.ps div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ps div:first-child{grid-column:1 / -1}
.ps b{font-weight:500;font-size:14px;overflow-wrap:anywhere}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--glow),inset 0 1px 0 var(--glass-hi);transform:scale(.97)}40%{box-shadow:0 0 0 6px var(--lime-soft),inset 0 1px 0 var(--glass-hi);transform:scale(1.01)}100%{box-shadow:0 0 0 0 transparent,inset 0 1px 0 var(--glass-hi);transform:none}}
.card.fresh{animation:fresh 1.6s ease-out}
@media (max-width:860px){
  .dialog.sheet{grid-template-columns:minmax(0,1fr);grid-template-areas:"form" "side" "act"}
  .sheet-side{border-left:0;border-top:1px solid var(--line)}
  .sheet-form{padding:20px 18px 8px}
  .sheet-side{padding:20px 18px}
  .sheet-actions{padding-inline:16px}
  .sheet-actions .btn{flex:1;justify-content:center}
  .sheet-actions .grow{display:none}
}


.lstrip{display:flex;flex-direction:column;gap:12px}
.lstrip-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lstrip-h h2{font-size:22px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ltile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 16px 16px;border-radius:var(--r-md);min-width:0;
  background:linear-gradient(180deg,var(--sheen),transparent 45%),var(--surface);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 14px 30px -24px var(--glass-shadow);
  -webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);transition:transform .2s,box-shadow .2s}
.ltile:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--glass-hi),0 22px 40px -24px var(--glass-shadow)}
.ltile b{font-weight:500;font-size:16px;line-height:1.25;overflow-wrap:anywhere;margin-top:4px}
.ltile .sub{font-size:12.5px;color:var(--ink-3)}
.ltile .peek{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ltile.new{background:transparent;border:1.5px dashed var(--line-2);box-shadow:none}
.ltile.new .list-ic{background:var(--lime);color:var(--lime-ink)}
.list-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--lime-soft);color:var(--ink);flex:none}
.list-ic.lg{width:60px;height:60px;border-radius:18px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.card .det .lst{display:inline-flex;align-items:center;gap:5px;background:var(--lime-soft);border-color:transparent;color:var(--ink)}
.pick.dashed{background:transparent;border:1.5px dashed var(--line-2);box-shadow:none}
.pick.iconpick{width:42px;justify-content:center;padding:0}
.danger-txt{color:var(--heart)}
.danger-txt.confirm{background:var(--heart);color:var(--lime-ink)}
.nav .ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- auth ---------- */
.btn.google{height:50px;justify-content:center;background:var(--raised);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 20px -14px var(--glass-shadow);color:var(--ink);gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.copyrow{display:flex;gap:10px;flex-wrap:wrap}
.copyrow .input{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2)}
.login .box .spin{width:16px;height:16px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .tb-nav{display:none}
  .shell{grid-template-columns:76px minmax(0,1fr)}
  .side{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1 / -1}
}
@media (max-width:720px){
  body{padding-block:12px 0}
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .rail-col{position:fixed;top:auto;height:auto;left:0;right:0;bottom:0;z-index:40;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .rail{flex-direction:row;justify-content:space-around;padding:8px;border-radius:22px}
  .rail .brand,.rail-tag,.rail-spacer,.rail-foot{display:none}
  .main{padding:20px 16px 24px;border-radius:22px}
  .stats{grid-template-columns:1fr}
  .stats .stat:last-child{grid-column:auto}
  .two{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login .art{padding:24px}
  .demo-card:nth-child(2),.demo-card:nth-child(3){margin-left:0}
  .dialog:not(.sheet){padding:18px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .topbar-inner{height:58px;gap:10px;padding:0 6px 0 8px}
  .tb-av{display:none}
  .tb-brand{font-size:17px}
  .tb-brand .mark{width:36px;height:36px}
  .tb-add span{display:none}
  .tb-add{width:40px;height:40px;padding:0;justify-content:center}
  .rail{border-radius:999px}
}
@media (max-width:360px){ .tb-brand span{display:none} }

/* ================= mobile-first refinements ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.overlay{overscroll-behavior:contain}
.rail-btn .tl{display:none}
.grabber{display:none}
.find{height:44px}
.find input{font-size:15px}
.find input::-webkit-search-cancel-button{display:none}
.clear-q{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--ink-2);flex:none}
.toast{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px}
.toast span{min-width:0}
.toast-btn{height:32px;padding:0 14px;border-radius:999px;background:var(--glow);color:var(--rail);font-weight:600;font-size:13.5px;flex:none}
.toast:not(:has(.toast-btn)){padding-right:18px}
@media (max-width:720px){
  body{padding-block:8px 0}
  .input,.textarea,.search input,.find input,.select,select{font-size:16px}
  .main{background:transparent!important;border:0!important;box-shadow:none!important;padding:6px 0 24px;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;gap:18px}
  .head{align-items:flex-start}
  .head h1{font-size:34px;letter-spacing:-.025em}
  .head>.btn.primary[data-act="new"]:not([data-list]){display:none}
  .head-actions{width:100%}
  .head-actions .btn{flex:1;justify-content:center}
  .topbar{margin-bottom:10px}
  .topbar-inner{height:56px;padding:0 6px}
  .tb-add{display:none}
  .tb-av{display:flex}
  .mode{width:104px;height:32px}
  .mode .lbl{font-size:9.5px;left:10px}
  .mode[aria-checked="true"] .lbl{left:35px}
  .mode .knob{width:26px;height:26px;left:calc(100% - 28.5px)}
  .rail-col{padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

/* ---------- motion: iOS 26 ---------- */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--spring-soft:cubic-bezier(.22,1.2,.36,1);--ease-out:cubic-bezier(.2,.8,.2,1)}

/* sliding glass lens in tab bars and segmented controls */
.has-lens{position:relative}

/* sheet presentation */
.overlay.opening{animation:ov-in .35s var(--ease-out) both}
.overlay.opening .dialog{animation:sheet-in .62s var(--spring-soft) both}
.overlay.closing{animation:ov-out .23s ease-in both}
.overlay.closing .dialog{animation:sheet-out .23s ease-in both}
@keyframes ov-in{from{background-color:transparent;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}}
@keyframes ov-out{to{background-color:transparent;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}}
@keyframes sheet-in{from{opacity:0;transform:translateY(34px) scale(.93);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes sheet-out{to{opacity:0;transform:translateY(20px) scale(.96);filter:blur(6px)}}
@media (max-width:720px){
  @keyframes sheet-in{from{opacity:.4;transform:translateY(70vh)}to{opacity:1;transform:none}}
  @keyframes sheet-out{to{opacity:.4;transform:translateY(60vh)}}
}

/* toast drops in like a notification */
.toast:not([hidden]){animation:toast-in .6s var(--spring) both}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.85);filter:blur(6px)}to{opacity:1;transform:translateX(-50%);filter:none}}

/* top bar condenses on scroll */
.topbar-inner{transition:height .5s var(--spring),padding .5s var(--spring),background-color .35s,box-shadow .35s,border-color .35s}
.tb-brand .mark{transition:width .5s var(--spring),height .5s var(--spring),transform .4s var(--spring)}
html.scrolled .topbar-inner{height:54px;box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo),0 18px 40px -20px var(--glass-shadow)}
html.scrolled .tb-brand .mark{width:34px;height:34px}
html.scrolled .tb-nav button{height:34px}
.tb-nav button{transition:transform .55s var(--spring),height .5s var(--spring),color .3s}

/* cards and tiles lift with spring */
.card:hover,.fcard:hover,.ltile:hover{transition-duration:.5s}
.chip,.pick[aria-pressed="true"]{transition:background-color .3s,color .3s,transform .5s var(--spring)}

@media (prefers-reduced-motion:reduce){
  .v-enter,.v-enter *,.overlay.opening,.overlay.opening .dialog,.toast:not([hidden]),.pop{animation:none!important}
  .lens{transition:none}
}

@media (max-width:720px){ .rail-btn{transition:height .45s var(--spring),transform .55s var(--spring),color .25s,background-color .3s} .rail{transition:padding .45s var(--spring)} }

/* ================= performance on phones / touch devices ================= */
@media (max-width:720px), (hover:none) and (pointer:coarse){
  /* the blurred color blobs were the heaviest thing on screen: paint them once as plain gradients */
  .ambient i{display:none}
  .ambient{background:
    radial-gradient(70vmax 60vmax at 0% 0%, var(--blob-a), transparent 60%),
    radial-gradient(60vmax 50vmax at 100% 35%, var(--blob-b), transparent 62%),
    radial-gradient(70vmax 60vmax at 40% 105%, var(--blob-d), transparent 60%),
    var(--canvas)}
  /* blur only on the two bars, and lighter */
  .topbar-inner,.rail{-webkit-backdrop-filter:blur(14px) saturate(160%)!important;backdrop-filter:blur(14px) saturate(160%)!important}
  .lens,.imgedit,.sheet-actions,.demo-card,.login .art,.login .box,.dialog,.side,.toast,.overlay{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .overlay{background:rgba(15,20,17,.45)}
  .dialog,.sheet-actions{background:var(--m-sheet)!important}
  .login .box{background:var(--m-card)}
  .toast{background:var(--rail)}
  /* small shadows instead of large soft ones */
  .card,.stat,.fcard,.ltile,.panel{box-shadow:0 1px 0 var(--glass-hi) inset,0 4px 14px -10px var(--glass-shadow)!important}
  .btn.primary,.btn.ghost,.lens,.rail-btn.add,.imgedit{box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 4px 12px -8px var(--glass-shadow)!important}
  /* only animate transform and opacity (no blur filters while moving) */
  .v-enter{animation-name:v-in-lite}
  @keyframes v-in-lite{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
  .overlay.opening .dialog{animation-name:sheet-in-lite}
  .overlay.closing .dialog{animation-name:sheet-out-lite}
  @keyframes sheet-in-lite{from{transform:translateY(100%)}to{transform:none}}
  @keyframes sheet-out-lite{to{transform:translateY(100%)}}
  .overlay.opening,.overlay.closing{animation-name:none}
  .toast:not([hidden]){animation-name:toast-lite}
  @keyframes toast-lite{from{opacity:0;transform:translateX(-50%) translateY(20px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
  .btn,.pill,.pick,.ltile,.tb-nav button,.rail-btn,.seg button,.fcard,.icon-btn,.card,.chip,.menu button,.nav button,.stepper button,.suggest{transition:transform .45s var(--spring),background-color .2s,color .2s}
  :is(.btn,.pill,.pick,.ltile,.tb-nav button,.rail-btn,.seg button,.fcard,.icon-btn)::after{transition:opacity .35s}
  .card.fresh{animation-name:rise}
  /* skip rendering cards that are off screen */
  .grid>.card{content-visibility:auto;contain-intrinsic-size:auto 360px}
  .card,.fcard,.ltile,.stat{contain:layout paint}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const want=new Set(S.friends); if(S.openFriend) want.add(S.openFriend);
  want.forEach(fid=>{
    if(watched[fid]) return;
    watched[fid]={
      a:onSnapshot(collection(db,'wishlists',fid,'items'), snap=>{ S.friendItems[fid]=snap.docs.map(d=>({id:d.id,...d.data()})); queueRender(); }, ()=>{ S.friendItems[fid]=S.friendItems[fid]||[]; queueRender(); }),
      c:onSnapshot(collection(db,'wishlists',fid,'lists'), snap=>{ S.friendLists[fid]=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); queueRender(); }, ()=>{ S.friendLists[fid]=[]; }),
      d:onSnapshot(collection(db,'claims',fid,'items'), snap=>{ const m={}; const u=new Set(); snap.docs.forEach(x=>{ const v=x.data(); m[x.id]=v; if(v.reservedBy) u.add(v.reservedBy); Object.keys(v.contrib||{}).forEach(k=>u.add(k)); }); S.claims[fid]=m; fetchProfiles([...u]); queueRender(); }, ()=>{ S.claims[fid]={}; }),
      b:onSnapshot(doc(db,'wishlists',fid), snap=>{ if(snap.exists()){ const d=snap.data(); S.profiles[fid]=profileFromDoc(d); S.friendProfile[fid]={birthday:d.birthday||''}; } else { S.profiles[fid]=S.profiles[fid]||{name:'',missing:true}; } queueRender(); }, ()=>{})
    };
  });

/* search by name prefix, or exact e-mail */
let searchSeq=0;
async function searchPeople(q){
  const seq=++searchSeq; q=q.trim();
  if(!q){ S.searchHits=[]; queueRender(); return; }
  const found=new Map();
  try{
    if(q.includes('@')){
      const m=await getDoc(doc(db,'emails',q.toLowerCase()));
      if(m.exists()){ const uid=m.data().uid; const p=await getDoc(doc(db,'wishlists',uid)); if(p.exists()) found.set(uid,profileFromDoc(p.data())); }
    } else {
      const lo=q.toLowerCase();
      const snap=await getDocs(query(collection(db,'wishlists'),where('nameLower','>=',lo),where('nameLower','<=',lo+''),limit(8)));
      snap.forEach(d=>found.set(d.id,profileFromDoc(d.data())));
    }
  }catch(e){ console.error(e); }
  if(seq!==searchSeq) return;
  found.forEach((p,id)=>{ S.profiles[id]=p; });
  S.searchHits=[...found.keys()].filter(id=>id!==S.me.id).map(id=>({id})); queueRender();
}

/* ================= derive ================= */
function filterItems(items, f, bday, mine){
  let out=items.slice();
  if(mine){ if(f.status==='ativos') out=out.filter(i=>!i.got); else if(f.status==='ganhos') out=out.filter(i=>i.got); else if(f.status==='sonhos') out=out.filter(i=>!i.got&&i.hearts>=5); }
  else out=out.filter(i=>!i.got);
  if(f.q&&f.q.trim()){ const q=f.q.trim().toLowerCase(); out=out.filter(i=>[i.title,i.note,i.color,i.size].some(x=>(x||'').toLowerCase().includes(q))); }
  if(f.list&&f.list!=='all') out=out.filter(i=>(i.listIds||[]).includes(f.list));
  if(f.cat!=='all') out=out.filter(i=>i.category===f.cat);
  if(f.range!=='all') out=out.filter(i=>(i.range||rangeFor(i.price))===f.range);
  const occDays=i=>bestOccasion(i,bday)?.days ?? 9999;
  const sorters={hearts:(a,b)=>(b.hearts||0)-(a.hearts||0)||(b.createdAt||0)-(a.createdAt||0),
    recent:(a,b)=>(b.createdAt||0)-(a.createdAt||0),
    priceAsc:(a,b)=>(a.price??1e9)-(b.price??1e9),
    occasion:(a,b)=>occDays(a)-occDays(b)||(b.hearts||0)-(a.hearts||0)};
  return out.sort(sorters[f.sort]||sorters.hearts);
}
function summary(items, bday){
  const active=items.filter(i=>!i.got);
  const priced=active.filter(i=>typeof i.price==='number');
  const total=priced.reduce((s,i)=>s+i.price,0);
  let next=null;
  active.forEach(i=>{ const b=bestOccasion(i,bday); if(b&&(!next||b.days<next.days||(b.days===next.days&&i.hearts>next.item.hearts))) next={...b,item:i}; });
  return {count:active.length, dreams:active.filter(i=>i.hearts>=5).length, got:items.filter(i=>i.got).length, total, priced:priced.length, next};
}

const MOTION={vk:null,at:0,dir:1,lens:{}};
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function viewKey(inApp){ if(S.guestCode) return 'sorteio:'+S.guestCode; if(S.helpOut&&!inApp) return 'ajuda-out'; if(inApp&&S.view==='ajuda') return 'ajuda'; if(!inApp) return 'login'; if(S.view==='secreto') return S.openGroup?'grupo:'+S.openGroup:'secreto'; return S.view==='amigos' ? (S.openFriend?'amigo:'+S.openFriend:'amigos') : S.view==='perfil' ? 'perfil' : (S.f.list!=='all'?'lista:'+S.f.list:'lista'); }
function viewRank(k){ if(!k) return 0; if(k==='login') return -1; if(k==='lista') return 0; if(k.startsWith('lista:')) return 1; if(k==='amigos') return 2; if(k.startsWith('amigo:')) return 3; if(k==='secreto') return 2.5; if(k.startsWith('grupo:')) return 3.5; if(k.startsWith('sorteio:')) return 5; if(k==='ajuda'||k==='ajuda-out') return 4.5; if(k==='perfil') return 4; return 0; }
function afterRender(){
  const el=performance.now()-MOTION.at;
  if(el<720 && !reduceMotion()){
    document.querySelectorAll('#main, .login, .guestpage').forEach(n=>{ n.classList.add('v-enter'); n.style.setProperty('--t',`-${Math.round(el)}ms`); n.style.setProperty('--dx', MOTION.dir>0?'28px':'-28px'); });
    document.querySelectorAll('#main .grid, #main .friend-grid, #main .lgrid, #main .stats').forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10))));
  }

}
const lensRO = 'ResizeObserver' in window ? new ResizeObserver(entries=>{
  entries.forEach(en=>{ const c=en.target.closest('.has-lens'); if(!c) return; const lens=c.querySelector(':scope > .lens'); const act=c.querySelector(':scope > [aria-current="page"], :scope > [aria-pressed="true"]');
    if(!lens||!act) return; lens.style.transition='none'; lens.style.left=act.offsetLeft+'px'; lens.style.top=act.offsetTop+'px'; lens.style.width=act.offsetWidth+'px'; lens.style.height=act.offsetHeight+'px';
    const key=c.classList[0]+':'+(c.getAttribute('aria-label')||''); MOTION.lens[key]={l:act.offsetLeft,t:act.offsetTop,w:act.offsetWidth,h:act.offsetHeight};
    requestAnimationFrame(()=>{ lens.style.transition=''; }); });
}) : null;
function updateLenses(){
  if(lensRO) lensRO.disconnect();
  document.querySelectorAll('.tb-nav, .rail, .seg').forEach(c=>{
    const key=c.classList[0]+':'+(c.getAttribute('aria-label')||'');
    const act=c.querySelector(':scope > [aria-current="page"], :scope > [aria-pressed="true"]');
    if(!act){ delete MOTION.lens[key]; return; }
    c.classList.add('has-lens');
    const lens=document.createElement('span'); lens.className='lens'; lens.setAttribute('aria-hidden','true');
    const r={l:act.offsetLeft,t:act.offsetTop,w:act.offsetWidth,h:act.offsetHeight};
    const prev=MOTION.lens[key]; MOTION.lens[key]=r;
    const put=v=>{ lens.style.left=v.l+'px'; lens.style.top=v.t+'px'; lens.style.width=v.w+'px'; lens.style.height=v.h+'px'; };
    lens.style.borderRadius=getComputedStyle(act).borderRadius;
    c.prepend(lens);
    if(lensRO){ lensRO.observe(c); lensRO.observe(act); }
    if(prev && (prev.l!==r.l||prev.t!==r.t||prev.w!==r.w||prev.h!==r.h) && !reduceMotion()){
      put(prev); lens.classList.add('moving'); lens.getBoundingClientRect();
      requestAnimationFrame(()=>{ put(r); setTimeout(()=>lens.classList.remove('moving'),260); });
    } else put(r);
  });
}

function banners(){

function statsBlock(sum, mine){
  const next=sum.next;
  return `<div class="stats">
    <div class="stat"><div class="lab">${mine?'Desejos na lista':'Desejos ativos'}</div><div class="big num">${sum.count}${sum.dreams?`<small>${sum.dreams} ${sum.dreams===1?'sonho':'sonhos'}</small>`:''}</div></div>
    <div class="stat"><div class="lab">Valor estimado</div><div class="mid num">${sum.priced?brl(sum.total):'—'}</div><div class="sub">${sum.priced?`Soma de ${sum.priced} ${sum.priced===1?'item com preço':'itens com preço'}`:'Informe preços para ver o total'}</div></div>
    <div class="stat"><div class="lab">Próxima ocasião</div>${next?`<div class="mid">${esc(OCC[next.id].label)} <span style="color:var(--ink-3)">${daysLabel(next.days)}</span></div><div class="sub">Presente sugerido: <b style="color:var(--ink);font-weight:500">${esc(next.item.title)}</b></div>`:`<div class="mid" style="color:var(--ink-3)">Nenhuma marcada</div><div class="sub">${mine?'Escolha ocasiões nos seus desejos':'Sem ocasiões com data'}</div>`}</div>
  </div>`;
}

  return `<div class="filters">
    <label class="search find" for="q-${scope}">${ic('search',17)}<input id="q-${scope}" type="search" data-act="q" data-scope="${scope}" placeholder="Buscar nos desejos" autocomplete="off" enterkeyhint="search" value="${esc(f.q||'')}">${f.q?`<button type="button" class="clear-q" data-act="clearq" data-scope="${scope}" aria-label="Limpar busca">${ic('close',14,2)}</button>`:''}</label>
    <div class="pillrow" role="group" aria-label="Categorias">
      <button class="pill" data-act="cat" data-scope="${scope}" data-v="all" aria-pressed="${f.cat==='all'}">${ic('all',18)}Todas</button>
      ${CATS.map(c=>`<button class="pill" data-act="cat" data-scope="${scope}" data-v="${c.id}" aria-pressed="${f.cat===c.id}">${ic(c.id,18)}${c.label}${counts[c.id]?` <span class="num" style="color:var(--ink-3)">${counts[c.id]}</span>`:''}</button>`).join('')}

    <div class="subrow">

        ${RANGES.map(r=>`<button data-act="range" data-scope="${scope}" data-v="${r.id}" aria-pressed="${f.range===r.id}">${r.label}</button>`).join('')}
      </div>
      <select class="select" id="sort-${scope}" data-act="sort" data-scope="${scope}" aria-label="Ordenar">
        ${[['hearts','Mais desejados'],['occasion','Ocasião mais próxima'],['recent','Mais recentes'],['priceAsc','Menor preço']].map(([v,l])=>`<option value="${v}" ${f.sort===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
  </div>`;
}

function heartsRow(item, editable){
  const h=item.hearts||0; const pop=S.pop&&S.pop.id===item.id&&performance.now()-S.pop.at<600?S.pop:null;
  return `<div class="hearts" role="group" aria-label="Quanto quer: ${h} de 5">
    ${[1,2,3,4,5].map(n=>`<button class="${n<=h?'on':''} ${pop&&n<=pop.n?'pop':''}" style="${pop&&n<=pop.n?`--t:-${Math.round(performance.now()-pop.at)}ms;--i:${n-1}`:''}" ${editable?`data-act="heart" data-id="${esc(item.id)}" data-v="${n}" aria-label="${n} de 5: ${LEVELS[n]}" title="${LEVELS[n]}"`:'disabled tabindex="-1" aria-hidden="true"'}>${heartSvg(20)}</button>`).join('')}
    <span class="lvl">${LEVELS[h]||''}</span>
  </div>`;
}

function wishCard(item, mine, bday, preview){
  const cat=CAT[item.category]||CAT.outros;
  const range=RNG[item.range||rangeFor(item.price)];
  const best=bestOccasion(item,bday);
  const occ=(item.occasions||[]);
  const sug = occ.length?[]:suggestOccasions(item.category,item.range,item.hearts||0);
  const priceTxt = typeof item.price==='number' ? `${brl(item.price)}${range?` · ${range.label}`:''}` : (range?range.label:'Preço não informado');
  const menuOpen = mine && S.menuOpen===item.id;
  let host=''; try{ if(item.url) host=new URL(item.url).hostname.replace(/^www\./,''); }catch(e){}
  const det=[item.size?`Tamanho ${item.size}`:'',item.color||''].filter(Boolean);
  const ownerLists = mine||preview ? S.myLists : (S.friendLists[S.openFriend]||[]);
  const inLists=(item.listIds||[]).map(id=>ownerLists.find(l=>l.id===id)).filter(Boolean);
  const reservedByOther=!mine&&!preview&&S.openFriend&&(claimOf(S.openFriend,item.id).reservedBy||'')&&claimOf(S.openFriend,item.id).reservedBy!==S.me.id;
  return `<article class="card ${item.got?'got':''} ${reservedByOther?'claimed':''} ${S.justAdded===item.id?'fresh':''} ${preview?'preview':''}">
    ${item.got&&item.gotPhoto?`<div class="thumb cover"><img src="${esc(item.gotPhoto)}" alt="Foto do presente" loading="lazy" decoding="async"></div>`:item.image?`<div class="thumb ${fitOf(item)==='cover'?'cover':''}"><img src="${esc(imgSrc(item.image,720))}" data-raw="${esc(item.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="imgFail(this)"></div>`:''}
    <div class="card-top">
      <span class="cat-ic">${ic(cat.id,20)}</span>
      <div class="meta"><span class="mono">${cat.label}</span><span class="price num">${esc(priceTxt)}</span></div>
      ${mine?`<button class="icon-btn" data-act="menu" data-id="${esc(item.id)}" aria-label="Opções de ${esc(item.title)}" aria-expanded="${menuOpen}">${ic(menuOpen?'close':'dots',18)}</button>`:''}
    </div>
    ${menuOpen?`<div class="menu">
      <button data-act="edit" data-id="${esc(item.id)}">Editar</button>
      <button data-act="got" data-id="${esc(item.id)}">${item.got?'Voltar para a lista':'Marcar como ganhei'}</button>
      <button class="danger" data-act="del" data-id="${esc(item.id)}">Excluir</button>
    </div>`:''}
    <h3>${esc(item.title)}</h3>
    ${det.length||item.qty>1||inLists.length?`<div class="det">${inLists.map(l=>`<span class="lst">${ic(l.icon||'folder',12)}${esc(l.name)}</span>`).join('')}${det.map(d=>`<span>${esc(d)}</span>`).join('')}${item.qty>1?`<span class="num">× ${item.qty}</span>`:''}</div>`:''}
    ${item.note?`<p class="note">${esc(item.note)}</p>`:''}
    ${item.got&&(item.gotFrom||item.gotNote)?`<p class="gotline">${ic('outros',14)}${item.gotFrom?`Presente de <b>${esc(item.gotFrom)}</b>`:'Ganhei'}${item.gotAt?` · ${new Date(item.gotAt).toLocaleDateString('pt-BR',{month:'short',year:'numeric'})}`:''}${item.gotNote?`<span>${esc(item.gotNote)}</span>`:''}</p>`:''}
    ${!mine&&!preview&&S.openFriend&&!item.got?claimBlock(item,S.openFriend):''}
    ${heartsRow(item, mine && S.canWrite && !item.got)}
    <div class="occ">
      ${item.got?`<span class="chip got">${ic('check',14,2)}Ganhei</span>`:''}
      ${occ.map(id=>{ const o=OCC[id]; if(!o) return ''; const n=nextOccurrence(id,bday); const isNext=best&&best.id===id&&!item.got;
        return `<span class="chip ${isNext?'next':''}">${esc(o.label)}${n?` · ${daysLabel(n.days)}`:''}</span>`; }).join('')}
      ${!item.got && sug.length?`<span class="chip sug" title="Sugestão de ocasião">${ic('spark',13)}Ideal para ${esc(sug.map(s=>OCC[s].label).slice(0,2).join(' ou '))}</span>`:''}
    </div>
    ${(host||(!mine&&!preview))?`<div class="card-foot">${host?`<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${ic('link',15)}${esc(host)}</a>`:'<span>Sem link</span>'}${!mine&&best?`<span class="r">${esc(OCC[best.id].label)} ${daysLabel(best.days)}</span>`:''}</div>`:''}
  </article>`;
}

function renderMine(sum){
  const items=filterItems(S.myItems,S.f,S.myProfile.birthday,true);
  const titles={ativos:'Minha lista',sonhos:'Meus sonhos',ganhos:'Já ganhei',todos:'Tudo'};
  const loading = !S.myLoaded && !S.stale;
  let body;
  if(loading) body=`<div class="empty"><span class="spin"></span><p>Carregando seus desejos…</p></div>`;
  else if(!S.myItems.length) body=`<div class="empty"><h3>Sua lista está vazia</h3><p>Adicione o primeiro desejo: dê um nome, diga quanto você quer de 1 a 5 corações e escolha a ocasião ideal para ganhar.</p><div class="head-actions" style="justify-content:center"><button class="btn primary" data-act="new" ${S.canWrite?'':'disabled'}>${ic('plus',18,2)}Adicionar desejo</button><button class="btn ghost" data-act="ideas">${ic('spark',17)}Me dê ideias</button></div></div>`;
  else if(!items.length) body=`<div class="empty"><h3>Nada com esses filtros</h3><p>Tente outra categoria ou faixa de preço.</p><button class="btn ghost" data-act="clear" data-scope="me">Limpar filtros</button></div>`;
  else body=`<div class="grid">${items.map(i=>wishCard(i,true,S.myProfile.birthday)).join('')}</div>`;
  const L = S.f.list!=='all' ? S.myLists.find(l=>l.id===S.f.list) : null;
  if(L){
    const inL=S.myItems.filter(i=>(i.listIds||[]).includes(L.id));
    const sumL=summary(inL,S.myProfile.birthday);
    if(!inL.length) body=`<div class="empty"><h3>Lista vazia</h3><p>Adicione um desejo direto nesta lista, ou abra um desejo que você já tem, clique em Editar e marque “${esc(L.name)}”.</p><button class="btn primary" data-act="new" data-list="${esc(L.id)}">${ic('plus',18,2)}Adicionar nesta lista</button></div>`;
    return `${banners()}
    <button class="back" data-act="openlist" data-v="all">${ic('back',18)}Todos os desejos</button>
    <div class="head"><div style="display:flex;align-items:center;gap:16px;min-width:0"><span class="list-ic lg">${ic(L.icon||'folder',28)}</span><div style="min-width:0"><span class="mono">Lista</span><h1>${esc(L.name)}</h1>${L.desc?`<p>${esc(L.desc)}</p>`:''}</div></div>
      <div class="head-actions"><button class="btn ghost" data-act="editlist" data-v="${esc(L.id)}">${ic('edit',17)}Editar lista</button><button class="btn primary" data-act="new" data-list="${esc(L.id)}">${ic('plus',18,2)}Adicionar nesta lista</button></div></div>
    ${statsBlock(sumL,true)}
    <div class="subrow"><div class="seg" role="group" aria-label="Situação">
      ${[['ativos','Desejos'],['sonhos','Sonhos'],['ganhos','Já ganhei'],['todos','Tudo']].map(([v,l])=>`<button data-act="status" data-v="${v}" aria-pressed="${S.f.status===v}">${l}</button>`).join('')}
    </div></div>
    ${filterBlock(S.f,inL,'me')}
    ${body}`;
  }
  return `${banners()}
    <div class="head"><div><h1>${titles[S.f.status]||'Minha lista'}</h1><p>${S.f.status==='ganhos'?'Os presentes que você já recebeu.':'Tudo o que você quer, do sonho ao mimo.'}</p></div>
      <div class="head-actions mine-actions"><button class="btn ghost" data-act="ideas">${ic('spark',17)}Ideias</button><button class="btn primary" data-act="new" ${S.canWrite?'':'disabled'}>${ic('plus',18,2)}Adicionar desejo</button></div></div>
    ${statsBlock(sum,true)}
    ${listStrip(S.myLists,S.myItems,true)}
    <div class="subrow"><div class="seg" role="group" aria-label="Situação">
      ${[['ativos','Desejos'],['sonhos','Sonhos'],['ganhos','Já ganhei'],['todos','Tudo']].map(([v,l])=>`<button data-act="status" data-v="${v}" aria-pressed="${S.f.status===v}">${l}</button>`).join('')}
    </div></div>
    ${filterBlock(S.f,S.myItems,'me')}
    ${body}`;
}

function listStrip(lists, items, mine){
  if(!mine && !lists.length) return '';
  const tile=l=>{ const inL=items.filter(i=>!i.got&&(i.listIds||[]).includes(l.id)); const top=inL.slice().sort((a,b)=>(b.hearts||0)-(a.hearts||0)).slice(0,2);
    return `<button class="ltile" data-act="${mine?'openlist':'flist'}" data-v="${esc(l.id)}"><span class="list-ic">${ic(l.icon||'folder',20)}</span><b>${esc(l.name)}</b><span class="sub num">${inL.length} ${inL.length===1?'desejo':'desejos'}</span>${top.length?`<span class="peek">${top.map(t=>esc(t.title)).join(' · ')}</span>`:''}</button>`; };
  return `<section class="lstrip" aria-label="Listas"><div class="lstrip-h"><h2>${mine?'Suas listas':'Listas'}</h2>${mine&&lists.length?'<span class="hint">Agrupe desejos por tema</span>':''}</div>
    <div class="lgrid">${lists.map(tile).join('')}${mine?`<button class="ltile new" data-act="newlist"><span class="list-ic">${ic('plus',20,2)}</span><b>Nova lista</b><span class="sub">${lists.length?'Crie outro grupo':'Ex.: “Relógios que eu quero”'}</span></button>`:''}</div></section>`;
}

      </div>
      ${!d._new&&d._confirm?`<p class="hint">Os ${count} ${count===1?'desejo':'desejos'} desta lista não são apagados: eles continuam em “Minha lista”.</p>`:''}
    </form></div>`;
}
async function submitList(){
  readListInputs(); const d=S.listDraft; const name=d.name.trim();
  if(!name){ d._err='Dê um nome para a lista.'; renderListModal(); document.getElementById('l-name')?.focus(); return; }
  const {_new,_err,_confirm,...l}=d; l.name=name; l.desc=(l.desc||'').trim();
  if(_new && !S.myLists.some(x=>x.id===l.id)) S.myLists=[...S.myLists,l];
  closeListEditor();
  if(_new){ S.view='lista'; S.f.list=l.id; S.f.status='ativos'; S.f.cat='all'; S.f.range='all'; setHash('lista'); }
  render(); wrap(API.saveList(l), _new?`Lista “${l.name}” criada`:'Lista atualizada');
}
async function deleteList(id){
  const L=S.myLists.find(l=>l.id===id); closeListEditor();
  S.myLists=S.myLists.filter(l=>l.id!==id); if(S.f.list===id) S.f.list='all'; render();
  const affected=S.myItems.filter(i=>(i.listIds||[]).includes(id));
  for(const it of affected){ try{ await API.patchItem(it.id,{listIds:(it.listIds||[]).filter(x=>x!==id)}); }catch(e){ console.error(e); } }
  wrap(API.deleteList(id), `Lista “${L?L.name:''}” excluída`);
}

const pendingProf=new Set();
function fetchProfiles(uids){
  uids.filter(u=>u&&!S.profiles[u]&&!pendingProf.has(u)&&u!==S.me.id).forEach(u=>{ pendingProf.add(u);
    getDoc(doc(db,'wishlists',u)).then(d=>{ S.profiles[u]=d.exists()?profileFromDoc(d.data()):{name:''}; queueRender(); }).catch(()=>{}); });
}
const claimOf=(fid,id)=>((S.claims[fid]||{})[id])||{};
const contribTotal=c=>Object.values(c.contrib||{}).reduce((s,v)=>s+(typeof v==='number'&&v>0?v:0),0);
const contribCount=c=>Object.values(c.contrib||{}).filter(v=>typeof v==='number'&&v>0).length;
const firstName=uid=>uid===S.me.id?'Você':((personInfo(uid).name||'Alguém').split(' ')[0]);
function agoLabel(ts){ if(!ts) return ''; const d=Math.floor((Date.now()-ts)/86400000); return d<=0?'hoje':d===1?'ontem':`há ${d} dias`; }

function claimBlock(item, fid){
  const c=claimOf(fid,item.id), me=S.me.id, by=c.reservedBy, total=contribTotal(c), mine=(c.contrib||{})[me]||0, n=contribCount(c);
  const price=typeof item.price==='number'?item.price*(item.qty||1):null;
  if(by===me) return `<div class="claim mine"><span class="chip next">${ic('check',13,2)}Você vai dar este</span><button class="linkbtn" data-act="unclaim" data-id="${esc(item.id)}">Cancelar reserva</button></div><p class="hint">Só você e os outros amigos veem isso. ${esc(personInfo(fid).name.split(' ')[0])} não fica sabendo.</p>`;
  if(by) return `<div class="claim"><span class="chip">${ic('outros',13)}Reservado por ${esc(firstName(by))}</span></div>`;
  const form = S.pledgeOpen===item.id ? `<form class="copyrow pledge" id="pledge-form" data-id="${esc(item.id)}" novalidate><div class="affix" style="flex:1;min-width:0"><span class="pre">R$</span><input class="input num" id="pledge-amt" inputmode="decimal" placeholder="${price?Math.max(10,Math.round((price-total)/2)):50}" value="${mine?String(mine).replace('.',','):''}"></div><button class="btn primary" type="submit">Confirmar</button><button class="btn ghost" type="button" data-act="pledgeclose">Cancelar</button></form>`:'';
  if(total>0){
    const pct=price?Math.min(100,Math.round(total/price*100)):null;
    return `<div class="vaq">
      <div class="vaq-top"><span class="mono">Vaquinha · ${n} ${n===1?'pessoa':'pessoas'}</span><b class="num">${brl(total)}${price?` <span>de ${brl(price)}</span>`:''}</b></div>
      ${pct!=null?`<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`:''}
      ${mine?`<p class="hint">Sua parte: <b class="num">${brl(mine)}</b> · <button class="linkbtn" data-act="pledge" data-id="${esc(item.id)}">mudar</button> · <button class="linkbtn" data-act="unpledge" data-id="${esc(item.id)}">sair</button></p>`
        :(S.pledgeOpen===item.id?'':`<button class="btn ghost sm" data-act="pledge" data-id="${esc(item.id)}">${ic('plus',15,2)}Entrar na vaquinha</button>`)}
      ${form}</div>`;
  }
  return `<div class="claim-actions">${S.pledgeOpen===item.id?form:`<button class="btn dark sm" data-act="claim" data-id="${esc(item.id)}">${ic('check',15,2)}Vou dar esse</button><button class="btn ghost sm" data-act="pledge" data-id="${esc(item.id)}">Fazer vaquinha</button>`}</div>`;
}

function feedBlock(){
  if(!S.friends.length) return '';
  const ev=[]; const now=Date.now();
  S.friends.forEach(fid=>{
    friendItemsOf(fid).filter(i=>!i.got&&i.createdAt&&now-i.createdAt<30*86400000).forEach(i=>ev.push({t:i.createdAt,fid,html:`adicionou <b>${esc(i.title)}</b>`,ago:agoLabel(i.createdAt)}));
    const bd=friendBday(fid), n=bd?nextOccurrence('aniversario',bd):null;
    if(n&&n.days<=30) ev.push({t:now+1e12-n.days,fid,html:`faz aniversário <b>${daysLabel(n.days)}</b>`,ago:n.date.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}),bday:true});
  });
  if(!ev.length) return '';
  ev.sort((a,b)=>b.t-a.t);
  return `<section class="panel feed"><h2>Novidades</h2><div class="people">${ev.slice(0,6).map(e=>`<button class="person feedrow" data-act="friend" data-v="${esc(e.fid)}">${avatar(e.fid,'sm')}<div class="who"><span class="ft"><b>${esc(personInfo(e.fid).name.split(' ')[0])}</b> ${e.html}</span><span>${e.bday?'🎂 ':''}${esc(e.ago)}</span></div>${ic('back',16)}</button>`).join('')}</div></section>`;
}
const BUDGETS=[['all','Qualquer valor',Infinity],['50','Até R$ 50',50],['150','Até R$ 150',150],['500','Até R$ 500',500]];
function ideasForFriends(){
  if(!S.friends.length) return '';
  const cap=(BUDGETS.find(b=>b[0]===S.feedBudget)||BUDGETS[0])[2];
  const fits=i=>{ const p=typeof i.price==='number'?i.price:(RNG[i.range]?RNG[i.range].min:null); return cap===Infinity||(p!=null&&p<=cap); };
  const tiles=[];
  S.friends.map(fid=>{ const bd=friendBday(fid), n=bd?nextOccurrence('aniversario',bd):null; return {fid,days:n?n.days:999}; }).sort((a,b)=>a.days-b.days).forEach(({fid,days})=>{
    friendItemsOf(fid).filter(i=>!i.got&&fits(i)&&!claimOf(fid,i.id).reservedBy).sort((a,b)=>(b.hearts||0)-(a.hearts||0)).slice(0,2).forEach(i=>tiles.push({fid,i,days}));
  });
  return `<section class="lstrip"><div class="lstrip-h"><h2>Ideias de presente</h2><span class="hint">Desejos dos seus amigos que ainda ninguém reservou</span></div>
    <div class="seg" role="group" aria-label="Orçamento">${BUDGETS.map(b=>`<button data-act="budget" data-v="${b[0]}" aria-pressed="${(S.feedBudget||'all')===b[0]}">${b[1]}</button>`).join('')}</div>
    ${tiles.length?`<div class="lgrid">${tiles.slice(0,10).map(({fid,i,days})=>`<button class="ltile idea" data-act="friend" data-v="${esc(fid)}">${i.image?`<span class="ithumb"><img src="${esc(imgSrc(i.image,240))}" data-raw="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)"></span>`:`<span class="list-ic">${ic(i.category||'outros',20)}</span>`}<b>${esc(i.title)}</b><span class="sub">Para ${esc(personInfo(fid).name.split(' ')[0])}${days<999?` · aniversário ${daysLabel(days)}`:''}</span><span class="peek num">${typeof i.price==='number'?brl(i.price):(RNG[i.range]?RNG[i.range].label:'Preço não informado')}</span></button>`).join('')}</div>`
      :`<p class="hint">Nenhum desejo dos seus amigos nessa faixa de preço.</p>`}</section>`;
}

const CODE_RE=/^[A-HJ-NP-Z2-9]{12}$/;
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const prettyCode=c=>c.match(/.{1,4}/g).join('-');
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim());
function brDateLong(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long'}); }
function daysUntil(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return Math.round((new Date(y,m-1,d)-today0())/86400000); }
function socialSeg(){ return `<div class="seg social-seg" role="group" aria-label="Social">
  <button data-act="go" data-v="amigos" aria-pressed="${S.view==='amigos'}">${ic('friends',16)}Amigos</button>

function openGroup(id){
  S.view='secreto'; S.openGroup=id; S.gConfirm=false; S.gDelConfirm=false; S.gErr=''; S.gInfo='';
  const g=id==='new'?null:S.groups.find(x=>x.id===id);
  S.gDraft = g ? JSON.parse(JSON.stringify(g)) : {id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:'',date:'',budget:null,message:'',participants:[],status:'rascunho',_new:true};
  setHash('secreto'); render(); window.scrollTo(0,0);
}
function readG(){
  const g=S.gDraft; if(!g) return; const v=id=>document.getElementById(id);
  if(v('g-name')) g.name=v('g-name').value; if(v('g-date')) g.date=v('g-date').value; if(v('g-msg')) g.message=v('g-msg').value;
  if(v('g-budget')){ const n=parsePrice(v('g-budget').value); g.budget=n; }
  if(v('g-pname')) S.gPName=v('g-pname').value; if(v('g-pemail')) S.gPEmail=v('g-pemail').value;
}
async function saveGroup(silent){
  readG(); const g=S.gDraft; if(!g.name.trim()){ S.gErr='Dê um nome ao amigo secreto.'; render(); document.getElementById('g-name')?.focus(); return false; }
  const data=stripPriv({...g,name:g.name.trim(),message:(g.message||'').trim(),owner:S.me.id,ownerName:S.me.name||'',updatedAt:Date.now()}); delete data.id;
  if(!data.createdAt) data.createdAt=Date.now();
  try{ await setDoc(doc(db,'santaGroups',g.id),clean(data)); g._new=false; if(!silent) toast('Amigo secreto salvo'); return true; }
  catch(e){ console.error(e); S.gErr='Não foi possível salvar. Confira se as regras novas foram publicadas no Firestore.'; render(); return false; }
}
async function callSanta(payload){
  const token=await auth.currentUser.getIdToken();
  const r=await fetch('/api/santa',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(payload)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||(r.status===404?'A função de sorteio ainda não foi publicada (api/santa.js).':'Não foi possível concluir agora.'));
  return j;
}
async function drawGroup(){
  if(!(await saveGroup(true))) return;
  S.gBusy=true; S.gErr=''; S.gConfirm=false; render();
  try{ const j=await callSanta({action:'draw',groupId:S.gDraft.id}); S.gInfo = j.failed&&j.failed.length ? `Sorteio feito. ${j.sent} códigos enviados; falhou para: ${j.failed.join(', ')}. Use “Reenviar”.` : `Sorteio feito! ${j.sent} códigos enviados por e-mail.`; haptic(20); toast('Sorteio feito');
  }catch(e){ S.gErr=e.message; }
  S.gBusy=false; render();
}
async function resendCode(i){
  S.gBusyIdx=i; render();
  try{ await callSanta({action:'resend',groupId:S.gDraft.id,index:i}); toast(`Código reenviado para ${S.gDraft.participants[i].name}`); }
  catch(e){ toast(e.message); }
  S.gBusyIdx=null; render();
}
async function loadInvite(code){
  S.guestCode=code; S.invite='loading'; S.revealed=false; render();

  catch(e){ console.error(e); S.invite='error'; }
  render();
}

function titleFromUrl(u){
  try{
    const url=new URL(/^https?:\/\//i.test(u)?u:'https://'+u);
    const segs=url.pathname.split('/').map(decodeURIComponent).filter(x=>x && !/^(p|dp|produto|product|item|i|gp|s)$/i.test(x));
    let best=segs.sort((a,b)=>(b.match(/[-_ ]/g)||[]).length-(a.match(/[-_ ]/g)||[]).length)[0]||'';
    best=best.replace(/\.(html?|aspx?|php)$/i,'').replace(/[-_+]+/g,' ').replace(/\b(mlb|sku|ref|id)?\d{5,}\b/gi,'').replace(/\s+/g,' ').trim().replace(/^(ml[a-z])\s+/i,'').replace(/\s+(jm|p)$/i,'');
    if(best.length<4||!/[a-zà-ú]{3}/i.test(best)) return '';
    best=best.toLowerCase(); return best.charAt(0).toUpperCase()+best.slice(1,90);
  }catch(e){ return ''; }
}

/* ---------- crop ---------- */
const CROP_W=800, CROP_H=600; // 4:3, same shape as the cards
function startCrop(){
  readDraftInputs(); const src=draft.image; if(!src) return;
  const local = src.startsWith('data:') || src.startsWith('blob:');
  draft._imgPanel=false;
  draft._crop={src: local?src:imgSrc(src,1400), zoom:1, x:0, y:0, ready:false, err:''};
  renderModal();
  const img=new Image();
  img.onload=()=>{ if(!draft||!draft._crop) return; Object.assign(draft._crop,{ready:true,nw:img.naturalWidth,nh:img.naturalHeight}); renderModal(); };
  img.onerror=()=>{ if(!draft||!draft._crop) return; draft._crop.err='Não foi possível carregar essa imagem para cortar. Tente enviar uma foto do aparelho.'; renderModal(); };
  img.src=draft._crop.src;
}
function cropLayout(){
  const c=draft&&draft._crop, st=document.getElementById('crop-stage'); if(!c||!c.ready||!st) return null;
  const W=st.clientWidth, H=st.clientHeight, base=Math.max(W/c.nw, H/c.nh), sc=base*c.zoom;
  const dw=c.nw*sc, dh=c.nh*sc;
  c.x=Math.min(0,Math.max(W-dw,c.x)); c.y=Math.min(0,Math.max(H-dh,c.y));
  return {W,H,sc,dw,dh};
}
function paintCrop(){
  const L=cropLayout(), im=document.getElementById('crop-img'); if(!L||!im) return;
  im.style.width=L.dw+'px'; im.style.height=L.dh+'px'; im.style.transform=`translate3d(${draft._crop.x}px,${draft._crop.y}px,0)`;
}
function bindCrop(){
  const st=document.getElementById('crop-stage'); if(!st||!draft||!draft._crop||!draft._crop.ready) return;
  const c=draft._crop;
  if(!c.placed){ const L0=(c.x=0,c.y=0,cropLayout()); if(L0){ c.x=(L0.W-L0.dw)/2; c.y=(L0.H-L0.dh)/2; } c.placed=true; }
  paintCrop();
  const pts=new Map(); let start=null;
  const zoomAt=(nz,cx,cy)=>{ const L=cropLayout(); if(!L) return; nz=Math.min(4,Math.max(1,nz)); const k=nz/c.zoom; c.x=cx-(cx-c.x)*k; c.y=cy-(cy-c.y)*k; c.zoom=nz; paintCrop(); const z=document.getElementById('crop-zoom'); if(z) z.value=c.zoom; };
  st.addEventListener('pointerdown',e=>{ st.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); start={x:c.x,y:c.y,px:e.clientX,py:e.clientY,zoom:c.zoom,dist:null};
    if(pts.size===2){ const [a,b]=[...pts.values()]; start.dist=Math.hypot(a.x-b.x,a.y-b.y); start.zoom=c.zoom; } });
  st.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&start.dist){ const [a,b]=[...pts.values()]; const r=st.getBoundingClientRect(); zoomAt(start.zoom*Math.hypot(a.x-b.x,a.y-b.y)/start.dist,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); }
    else if(pts.size===1){ c.x=start.x+(e.clientX-start.px); c.y=start.y+(e.clientY-start.py); paintCrop(); } });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size===1){ const [p]=[...pts.values()]; start={x:c.x,y:c.y,px:p.x,py:p.y,zoom:c.zoom,dist:null}; } };
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{ e.preventDefault(); const r=st.getBoundingClientRect(); zoomAt(c.zoom*(e.deltaY<0?1.08:0.93),e.clientX-r.left,e.clientY-r.top); },{passive:false});
  const z=document.getElementById('crop-zoom');
  if(z) z.addEventListener('input',()=>{ const L=cropLayout(); if(L) zoomAt(+z.value,L.W/2,L.H/2); });
}
async function applyCrop(){
  const L=cropLayout(), im=document.getElementById('crop-img'); if(!L||!im) return;
  const c=draft._crop, cv=document.createElement('canvas'); cv.width=CROP_W; cv.height=CROP_H;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,CROP_W,CROP_H);
  ctx.drawImage(im,-c.x/L.sc,-c.y/L.sc,L.W/L.sc,L.H/L.sc,0,0,CROP_W,CROP_H);
  let out; try{
    let type='image/webp', q=.82; out=cv.toDataURL(type,q);
    if(!out.startsWith('data:image/webp')){ type='image/jpeg'; out=cv.toDataURL(type,q); }
    while(out.length>240000&&q>.3){ q-=.12; out=cv.toDataURL(type,q); }
  }catch(e){ c.err='Essa imagem não pode ser cortada. Tente enviar uma foto do aparelho.'; c.ready=false; renderModal(); return; }
  draft.image=out; draft.imageAuto=false; draft.imageFit='cover'; draft._crop=null; renderModal(); haptic(); toast('Imagem cortada');
}

async function fileToDataUrl(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const max=720, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let type='image/webp', q=.8, out=c.toDataURL(type,q);
    if(!out.startsWith('data:image/webp')){ type='image/jpeg'; out=c.toDataURL(type,q); }
    while(out.length>240000&&q>.3){ q-=.12; out=c.toDataURL(type,q); }
    return out.length<=290000?out:null;
  } finally { URL.revokeObjectURL(url); }
}

function parsePrice(v){
  const raw=String(v).replace(/[^\d,.]/g,''); if(!raw) return null;
  let n;
  if(raw.includes(',')) n=parseFloat(raw.replace(/\./g,'').replace(',','.'));
  else if(/^\d{1,3}(\.\d{3})+$/.test(raw)) n=parseFloat(raw.replace(/\./g,''));
  else n=parseFloat(raw);
  return isNaN(n)||n<0 ? null : Math.round(n*100)/100;
}
function readDraftInputs(){
  if(!draft) return;
  const g=id=>document.getElementById(id);
  if(g('f-title')) draft.title=g('f-title').value;
  if(g('f-url')) draft.url=g('f-url').value.trim();
  if(g('f-note')) draft.note=g('f-note').value;
  if(g('f-size')) draft.size=g('f-size').value;
  if(g('f-color')) draft.color=g('f-color').value;
  if(g('f-price')){ draft.price=parsePrice(g('f-price').value); if(draft.price!=null) draft.range=rangeFor(draft.price); }
}
function submitDraft(again){

  if(!draft.title.trim()) errs.title='Dê um nome ao desejo.';
  if(!draft.category) errs.category='Escolha uma categoria.';
  draft._errs=errs;
  if(Object.keys(errs).length){ renderModal(); document.getElementById(errs.title?'f-title':'wish-form')?.focus(); return; }
  if(draft.url && !/^https?:\/\//i.test(draft.url)) draft.url='https://'+draft.url;
  const _new=draft._new; const item=stripPriv(draft);
  item.title=item.title.trim(); item.note=(item.note||'').trim(); item.size=(item.size||'').trim(); item.color=(item.color||'').trim();
  item.range=item.range||rangeFor(item.price)||'';
  if(_new){ lsSet(DRAFT_KEY,null); S.justAdded=item.id; S.view='lista'; S.openFriend=null; if(S.f.status==='ganhos') S.f.status='ativos'; S.f.cat='all'; S.f.range='all'; setHash('lista'); setTimeout(()=>{ S.justAdded=null; },2400); }
  wrap(API.saveItem(item), _new?`“${item.title}” entrou na sua lista`:'Desejo atualizado');
  if(again){ const keepCat=item.category; draft=blankDraft(); draft.category=keepCat; draft._new=true; draft._errs={}; renderModal(); render(); setTimeout(()=>document.getElementById('f-url')?.focus(),30); }
  else { draft=null; hideModal(); render(); }
}

  if(e.target.id==='friend-search'){
    S.searchQ=e.target.value; clearTimeout(searchT);
    searchT=setTimeout(()=>searchPeople(S.searchQ),280);
  }
});
document.addEventListener('toggle', e=>{ const d=e.target; if(d.classList&&d.classList.contains('hsec')&&d.open){ S.helpOpen=d.dataset.id; document.querySelectorAll('.hsec[open]').forEach(x=>{ if(x!==d&&!S.helpQ) x.open=false; }); } }, true);
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if(S.listDraft||S.gotDraft||S.ideasOpen||draft) closeAnyModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&e.target.id==='f-newlist'){ e.preventDefault(); document.querySelector('[data-act="dcreatelist"]')?.click(); } });
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeAnyModal(); });
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); const inv=pendingInvite();
  if(h.startsWith('s-')){ const c=normCode(h.slice(2)); if(CODE_RE.test(c)&&c!==S.guestCode) loadInvite(c); return; }
  if(S.guestCode&&!h.startsWith('s-')){ S.guestCode=null; S.invite=null; }
  if(inv){ if(S.loggedIn&&inv!==S.me.id){ S.view='amigos'; S.openFriend=inv; syncWatched(); render(); } else S.invitedBy=inv; return; }
  if(['lista','amigos','perfil','secreto','ajuda'].includes(h)&&S.view!==h){ S.view=h; S.openFriend=null; if(S.loggedIn) syncWatched(); render(); } });

/* ================= boot ================= */
{ const h=location.hash.slice(1); if(h.startsWith('s-')){ const c=normCode(h.slice(2)); if(CODE_RE.test(c)) setTimeout(()=>loadInvite(c),0); } }
{ const h=location.hash.slice(1); if(['lista','amigos','perfil','secreto','ajuda'].includes(h)) S.view=h; S.invitedBy=pendingInvite(); }
render();
onAuthStateChanged(auth, u=>{
  S.authBusy=false;
  if(u){ if(S.me.id!==u.uid){ endSession(); startSession(u); } }
  else { endSession(); S.phase='ready'; render(); }
});
})();
</script>
